<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hikvision Izleme</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-alt: #f7f9fc;
    --border: #cfd6df;
    --border-strong: #b6c0cc;
    --text: #1c2733;
    --muted: #5f6c7b;
    --accent: #1f5f99;
    --ok: #0f8a4b;
    --off: #7a8694;
    --err: #c62828;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  h1, h2, p {
    margin: 0;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
  }

  .sub {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button,
  a.button-link,
  select {
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  a.button-link {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }

  main {
    padding: 16px;
  }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .panel-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-alt);
  }

  .panel-head h2 {
    font-size: 14px;
    font-weight: 600;
  }

  .panel-body {
    padding: 12px;
  }

  .side-stack {
    display: grid;
    gap: 12px;
  }

  .info-box {
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  .cam-list {
    display: grid;
    gap: 8px;
  }

  .cam-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
  }

  .cam-item.active {
    border-color: var(--accent);
    background: #f1f7fe;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.on { background: var(--ok); }
  .dot.off { background: var(--off); }

  .cam-name {
    flex: 1;
    font-size: 13px;
  }

  .empty-state {
    padding: 18px 8px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;
  }

  .player-status {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
  }

  .summary-item {
    padding: 10px;
    border: 1px solid var(--border);
    background: #fff;
  }

  .summary-item span {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Hikvision Izleme</h1>
    <div class="sub">Cloud kamera listesi ve HLS izleme.</div>
  </div>
  <div class="toolbar">
    <a class="button-link" href="/camera-setup">Kurulum</a>
    <a class="button-link" href="/team-device-add">Team'e Ekle</a>
    <a class="button-link" href="/camera-browser-test">Tarayici Testi</a>
    <button id="refresh-btn">Listeyi Yenile</button>
  </div>
</header>

<main>
  <div class="layout">
    <section class="side-stack">
      <div class="panel">
        <div class="panel-head">
          <h2>Baglanti</h2>
        </div>
        <div class="panel-body">
          <div class="info-box" id="health-box">Baglanti kontrol ediliyor...</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Liste</h2>
        </div>
        <div class="panel-body">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <label for="quality-select" style="font-size:12px; font-weight:600;">Kalite</label>
            <select id="quality-select">
              <option value="1">HD</option>
              <option value="2">Akici</option>
            </select>
          </div>
          <div class="info-box" style="margin-bottom:10px;">
            Kamera cloud tarafinda online ve H.264 uyumlu olmali.
          </div>
          <div class="cam-list" id="camera-list"></div>
          <div class="empty-state" id="camera-placeholder">Kameralar yukleniyor...</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Canli Yayin</h2>
      </div>
      <div class="panel-body">
        <video id="player" controls muted playsinline></video>
        <div class="player-status">
          <span id="status-text">Bir kamera secin</span>
          <span id="expire-text"></span>
        </div>
        <div class="summary-grid">
          <div class="summary-item">
            <span>Kamera</span>
            <strong id="camera-meta">Secim yok</strong>
          </div>
          <div class="summary-item">
            <span>Protokol</span>
            <strong id="protocol-meta">HLS</strong>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
  const listEl = document.getElementById("camera-list");
  const placeholderEl = document.getElementById("camera-placeholder");
  const videoEl = document.getElementById("player");
  const statusEl = document.getElementById("status-text");
  const expireEl = document.getElementById("expire-text");
  const healthEl = document.getElementById("health-box");
  const qualityEl = document.getElementById("quality-select");
  const cameraMetaEl = document.getElementById("camera-meta");
  const protocolMetaEl = document.getElementById("protocol-meta");
  let hls = null;
  let activeCard = null;

  async function loadHealth() {
    try {
      const res = await fetch("/api/health");
      const data = await res.json();
      if (!data.ok) {
        healthEl.innerHTML = `<strong>Durum:</strong> hazir degil<br>${data.error || "Kimlik bilgileri eksik."}`;
        return;
      }

      healthEl.innerHTML = `<strong>Durum:</strong> bagli<br><strong>Area domain:</strong> ${data.areaDomain || "Henuz alinmadi"}<br><strong>Mod:</strong> HLS proxy`;
    } catch (err) {
      healthEl.innerHTML = `<strong>Durum:</strong> hata<br>${err.message}`;
    }
  }

  function destroyHls() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
  }

  async function loadCameras() {
    listEl.innerHTML = "";
    placeholderEl.style.display = "block";
    placeholderEl.textContent = "Kameralar yukleniyor...";
    placeholderEl.style.color = "var(--muted)";

    try {
      const res = await fetch("/api/cameras");
      const data = await res.json();

      if (!res.ok) {
        placeholderEl.textContent = data.error || "Kamera listesi alinamadi";
        placeholderEl.style.color = "var(--err)";
        return;
      }

      if (!data.cameras || data.cameras.length === 0) {
        placeholderEl.textContent = "Kamera bulunamadi";
        return;
      }

      placeholderEl.style.display = "none";

      data.cameras.forEach((cam) => {
        const card = document.createElement("div");
        card.className = "cam-item";
        card.innerHTML = `
          <span class="dot ${cam.online ? "on" : "off"}"></span>
          <span class="cam-name">${cam.name}</span>
        `;
        card.addEventListener("click", () => selectCamera(cam, card));
        listEl.appendChild(card);
      });
    } catch (err) {
      placeholderEl.textContent = err.message;
      placeholderEl.style.color = "var(--err)";
    }
  }

  async function selectCamera(cam, card) {
    if (activeCard) activeCard.classList.remove("active");
    card.classList.add("active");
    activeCard = card;
    cameraMetaEl.textContent = cam.name;
    statusEl.textContent = `${cam.name} - yayin adresi aliniyor...`;
    expireEl.textContent = "";

    if (!cam.deviceSerial) {
      statusEl.textContent = "Bu kamerada deviceSerial bilgisi yok.";
      return;
    }

    try {
      const params = new URLSearchParams({
        resourceId: cam.resourceId,
        deviceSerial: cam.deviceSerial,
        quality: qualityEl.value,
        protocol: "2",
      });

      const res = await fetch(`/api/stream?${params}`);
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = `Hata: ${data.error || "Yayin alinamadi"}`;
        return;
      }

      protocolMetaEl.textContent =
        data.protocol === 2 ? "HLS" :
        data.protocol === 1 ? "EZOPEN" :
        data.protocol === 3 ? "RTMP" :
        `Protocol ${data.protocol}`;

      playHls(data.url);
      statusEl.textContent = `${cam.name} - HLS oynatma baslatiliyor.`;

      if (data.expireTime) {
        const expires = new Date(data.expireTime);
        expireEl.textContent = `Link gecerlilik: ${expires.toLocaleTimeString("tr-TR")}`;
      }
    } catch (err) {
      statusEl.textContent = `Hata: ${err.message}`;
    }
  }

  function playHls(url) {
    destroyHls();

    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.load();

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(videoEl);
      hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_event, data) => {
        statusEl.textContent = `HLS oynatma hatasi: ${data?.details || "bilinmeyen hata"}`;
      });
      return;
    }

    if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
      videoEl.src = url;
      videoEl.play().catch(() => {});
      return;
    }

    statusEl.textContent = "Tarayiciniz HLS oynatmayi desteklemiyor.";
  }

  document.getElementById("refresh-btn").addEventListener("click", loadCameras);
  loadHealth();
  loadCameras();
</script>
</body>
</html>
