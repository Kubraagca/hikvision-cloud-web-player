<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team'e Kamera Ekle</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-alt: #f7f9fc;
    --border: #cfd6df;
    --border-strong: #b6c0cc;
    --text: #1c2733;
    --muted: #5f6c7b;
    --accent: #1f5f99;
    --ok: #0f8a4b;
    --err: #c62828;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  h1, h2, p {
    margin: 0;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
  }

  .sub {
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  a, button, input {
    font: inherit;
  }

  a.button-link,
  button {
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }

  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  main {
    padding: 16px;
  }

  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
  }

  @media (max-width: 920px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .panel-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-alt);
  }

  .panel-head h2 {
    font-size: 14px;
    font-weight: 600;
  }

  .panel-body {
    padding: 12px;
  }

  .field-grid {
    display: grid;
    gap: 10px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .field small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
  }

  .field input {
    width: 100%;
    height: 36px;
    padding: 7px 9px;
    border: 1px solid var(--border-strong);
    background: #fff;
  }

  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .status-box,
  .result-card {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  @media (max-width: 640px) {
    .summary-grid {
      grid-template-columns: 1fr;
    }
  }

  .summary-item {
    padding: 10px;
    border: 1px solid var(--border);
    background: #fff;
  }

  .summary-item span {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .err {
    color: var(--err);
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Team'e Kamera Ekle</h1>
    <div class="sub">Bu ekran sadece backend uzerinden istek gonderir. AK/SK ve token tarayiciya gelmez.</div>
  </div>
  <div class="toolbar">
    <a class="button-link" href="/">Izleme</a>
    <a class="button-link" href="/camera-setup">Kurulum</a>
  </div>
</header>

<main>
  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>Cihaz Bilgileri</h2>
      </div>
      <div class="panel-body">
        <div class="field-grid">
          <div class="field">
            <label for="short-serial">Kisa Seri No</label>
            <input id="short-serial" type="text" placeholder="Orn. ABCD123456" />
          </div>
          <div class="field">
            <label for="verification-code">Verification Code</label>
            <input id="verification-code" type="text" placeholder="12 karakter" />
          </div>
          <div class="field">
            <label for="alias">Cihaz Adi</label>
            <input id="alias" type="text" placeholder="Bos ise CAM-{shortSerial}" />
          </div>
          <div class="field">
            <label for="area-name">Area Adi</label>
            <input id="area-name" type="text" placeholder="Orn. Merkez Ofis" />
          </div>
          <div class="field">
            <label for="user-name">Kullanici Adi</label>
            <input id="user-name" type="text" value="admin" />
            <small>Test icin kullanilir. Gerekli degilse bos birakilabilir.</small>
          </div>
          <div class="field">
            <label for="device-password">Kamera Parolasi</label>
            <input id="device-password" type="password" />
          </div>
        </div>

        <div class="action-row">
          <button id="submit-btn" class="primary">Team'e Ekle</button>
        </div>

        <div class="status-box" id="status-box">Hazir.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Sonuc</h2>
      </div>
      <div class="panel-body">
        <div class="summary-grid">
          <div class="summary-item"><span>Alias</span><strong id="alias-value">-</strong></div>
          <div class="summary-item"><span>Kisa Seri</span><strong id="serial-value">-</strong></div>
          <div class="summary-item"><span>Area</span><strong id="area-value">-</strong></div>
          <div class="summary-item"><span>Device ID</span><strong id="device-id-value">-</strong></div>
          <div class="summary-item"><span>Cihaz Durumu</span><strong id="device-status-value">-</strong></div>
          <div class="summary-item"><span>Kanal Durumu</span><strong id="channel-status-value">-</strong></div>
        </div>
        <div class="result-card" id="result-box">Henuz istek gonderilmedi.</div>
      </div>
    </section>
  </div>
</main>

<script>
  const statusBox = document.getElementById("status-box");
  const resultBox = document.getElementById("result-box");
  const submitBtn = document.getElementById("submit-btn");

  function setStatus(message, isError = false) {
    statusBox.textContent = message;
    statusBox.className = `status-box ${isError ? "err" : ""}`;
  }

  function fillResult(result) {
    document.getElementById("alias-value").textContent = result?.alias || "-";
    document.getElementById("serial-value").textContent = result?.shortSerial || "-";
    document.getElementById("area-value").textContent = result?.areaName ? `${result.areaName} (${result.areaId || "-"})` : "-";
    document.getElementById("device-id-value").textContent = result?.deviceId || "-";
    document.getElementById("device-status-value").textContent = result?.deviceStatusMessage || "-";
    document.getElementById("channel-status-value").textContent = result?.channelStatusMessage || "-";
    resultBox.textContent = result
      ? JSON.stringify({
          success: result.success,
          deviceAdded: result.deviceAdded,
          importedChannelCount: result.importedChannelCount,
          totalChannelCount: result.totalChannelCount
        }, null, 2)
      : "Henuz istek gonderilmedi.";
  }

  submitBtn.addEventListener("click", async () => {
    const payload = {
      shortSerial: document.getElementById("short-serial").value.trim(),
      verificationCode: document.getElementById("verification-code").value.trim(),
      alias: document.getElementById("alias").value.trim(),
      areaName: document.getElementById("area-name").value.trim(),
      userName: document.getElementById("user-name").value.trim(),
      password: document.getElementById("device-password").value
    };

    if (!payload.shortSerial) {
      setStatus("Kisa seri no zorunlu.", true);
      return;
    }

    if (!payload.verificationCode) {
      setStatus("Verification code zorunlu.", true);
      return;
    }

    submitBtn.disabled = true;
    setStatus("Team kaydi baslatiliyor...");
    fillResult(null);

    try {
      const response = await fetch("/api/team-devices/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Team kaydi basarisiz.");
      }

      fillResult(data.result);
      setStatus(data.message || "Kamera Team hesabina eklendi.");
    } catch (error) {
      setStatus(error.message || "Istek basarisiz.", true);
      resultBox.textContent = "Islem tamamlanamadi.";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
