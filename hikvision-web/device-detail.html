<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cihaz Detayi</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-alt: #f7f9fc;
    --border: #cfd6df;
    --text: #1c2733;
    --muted: #5f6c7b;
    --accent: #1f5f99;
    --ok: #0f8a4b;
    --err: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header, main { padding: 16px; }
  .head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  h1, h2, p { margin: 0; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, a, input, textarea {
    font: inherit;
  }
  button, a.button-link {
    min-height: 36px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .panel-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-alt);
  }
  .panel-body { padding: 12px; }
  .grid { display: grid; gap: 10px; }
  .summary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .item {
    padding: 10px;
    border: 1px solid var(--border);
    background: #fff;
  }
  .item span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  label {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  input, textarea {
    width: 100%;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
  }
  textarea { min-height: 180px; resize: vertical; }
  .status {
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    font-size: 12px;
    color: var(--muted);
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<header class="head">
  <div>
    <h1>Cihaz Detayi</h1>
    <div class="sub">Cloud proxypass uzerinden cihaz network ayarlarini oku, guncelle ve reboot et.</div>
  </div>
  <div class="actions">
    <a class="button-link" href="/">Izleme</a>
  </div>
</header>

<main>
  <div class="layout">
    <section class="panel">
      <div class="panel-head"><h2>Kimlik</h2></div>
      <div class="panel-body grid">
        <div class="summary">
          <div class="item"><span>Kamera</span><strong id="name-meta">-</strong></div>
          <div class="item"><span>Device ID</span><strong id="device-id-meta">-</strong></div>
          <div class="item"><span>Resource ID</span><strong id="resource-id-meta">-</strong></div>
          <div class="item"><span>Serial</span><strong id="serial-meta">-</strong></div>
        </div>
        <div id="status-box" class="status">Bilgiler hazirlaniyor...</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Network</h2></div>
      <div class="panel-body grid">
        <div class="summary">
          <div class="item"><span>Interface ID</span><strong id="interface-id-meta">-</strong></div>
          <div class="item"><span>DHCP</span><strong id="dhcp-meta">-</strong></div>
        </div>
        <label>IP Address <input id="ip-input" type="text" /></label>
        <label>Subnet Mask <input id="mask-input" type="text" /></label>
        <label>Gateway <input id="gateway-input" type="text" /></label>
        <label>Primary DNS <input id="dns1-input" type="text" /></label>
        <label>Secondary DNS <input id="dns2-input" type="text" /></label>
        <div class="row">
          <button id="load-btn" type="button">Network Oku</button>
          <button id="save-btn" type="button">IP Ayarlarini Kaydet</button>
          <button id="reboot-btn" type="button">Cihazi Reboot Et</button>
        </div>
      </div>
    </section>
  </div>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><h2>Hik-Connect / EZVIZ</h2></div>
    <div class="panel-body grid">
      <div class="summary">
        <div class="item"><span>Enabled</span><strong id="ezviz-enabled-meta">-</strong></div>
        <div class="item"><span>Register Status</span><strong id="ezviz-register-meta">-</strong></div>
      </div>
      <label>Verification Code <input id="verification-input" type="text" /></label>
      <div class="row">
        <button id="load-ezviz-btn" type="button">Verification Oku</button>
        <button id="save-ezviz-btn" type="button">Verification Kaydet</button>
      </div>
    </div>
  </section>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><h2>Kamera Ayarlari</h2></div>
    <div class="panel-body grid">
      <label>Kamera IP <input id="provision-ip-input" type="text" /></label>
      <label>Kullanici Adi <input id="provision-username-input" type="text" value="admin" /></label>
      <label>Parola <input id="provision-password-input" type="password" /></label>
      <label>Alan Adi <input id="provision-area-input" type="text" /></label>
      <label>Gateway Override <input id="provision-gateway-input" type="text" /></label>
      <label>SDK Port <input id="provision-sdk-port-input" type="number" value="8000" /></label>
      <label><input id="provision-dhcp-input" type="checkbox" /> DHCP etkinlestir</label>
      <div class="row">
        <button id="start-provision-btn" type="button">Kamera Ayarlarini Uygula</button>
      </div>
      <div id="provision-status-box" class="status">Hazir.</div>
      <textarea id="provision-result-output" readonly></textarea>
    </div>
  </section>

  <section class="panel" style="margin-top:16px;">
    <div class="panel-head"><h2>Ham XML</h2></div>
    <div class="panel-body">
      <textarea id="xml-output" readonly></textarea>
    </div>
  </section>
</main>

<script>
  const qs = new URLSearchParams(location.search);
  const state = {
    name: qs.get("name") || "",
    deviceId: qs.get("deviceId") || "",
    resourceId: qs.get("resourceId") || "",
    deviceSerial: qs.get("deviceSerial") || "",
    interfaceId: "1",
  };

  const nameMetaEl = document.getElementById("name-meta");
  const deviceIdMetaEl = document.getElementById("device-id-meta");
  const resourceIdMetaEl = document.getElementById("resource-id-meta");
  const serialMetaEl = document.getElementById("serial-meta");
  const interfaceIdMetaEl = document.getElementById("interface-id-meta");
  const dhcpMetaEl = document.getElementById("dhcp-meta");
  const statusBoxEl = document.getElementById("status-box");
  const xmlOutputEl = document.getElementById("xml-output");
  const ezvizEnabledMetaEl = document.getElementById("ezviz-enabled-meta");
  const ezvizRegisterMetaEl = document.getElementById("ezviz-register-meta");
  const ipInputEl = document.getElementById("ip-input");
  const maskInputEl = document.getElementById("mask-input");
  const gatewayInputEl = document.getElementById("gateway-input");
  const dns1InputEl = document.getElementById("dns1-input");
  const dns2InputEl = document.getElementById("dns2-input");
  const verificationInputEl = document.getElementById("verification-input");
  const provisionIpInputEl = document.getElementById("provision-ip-input");
  const provisionUserInputEl = document.getElementById("provision-username-input");
  const provisionPasswordInputEl = document.getElementById("provision-password-input");
  const provisionAreaInputEl = document.getElementById("provision-area-input");
  const provisionGatewayInputEl = document.getElementById("provision-gateway-input");
  const provisionSdkPortInputEl = document.getElementById("provision-sdk-port-input");
  const provisionDhcpInputEl = document.getElementById("provision-dhcp-input");
  const provisionStatusBoxEl = document.getElementById("provision-status-box");
  const provisionResultOutputEl = document.getElementById("provision-result-output");
  let provisionPollTimer = null;

  function setStatus(text, kind = "") {
    statusBoxEl.textContent = text;
    statusBoxEl.className = `status ${kind}`.trim();
  }

  function setProvisionStatus(text, kind = "") {
    provisionStatusBoxEl.textContent = text;
    provisionStatusBoxEl.className = `status ${kind}`.trim();
  }

  function syncMeta() {
    nameMetaEl.textContent = state.name || "-";
    deviceIdMetaEl.textContent = state.deviceId || "-";
    resourceIdMetaEl.textContent = state.resourceId || "-";
    serialMetaEl.textContent = state.deviceSerial || "-";
    interfaceIdMetaEl.textContent = state.interfaceId || "-";
  }

  async function loadNetwork() {
    if (!state.deviceId) {
      setStatus("Device ID bulunamadi.", "err");
      return;
    }

    setStatus("Network ayarlari okunuyor...");
    const res = await fetch(`/api/device-config/network?deviceId=${encodeURIComponent(state.deviceId)}`);
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || "Network ayarlari alinamadi.");
    }

    xmlOutputEl.value = data.xml || "";
    const current = Array.isArray(data.interfaces) && data.interfaces.length ? data.interfaces[0] : null;
    if (!current) {
      throw new Error("Network interface bulunamadi.");
    }

    state.interfaceId = current.id || "1";
    syncMeta();
    dhcpMetaEl.textContent = current.dhcpMode || "-";
    ipInputEl.value = current.ipAddress === "-" ? "" : current.ipAddress;
    maskInputEl.value = current.subnetMask === "-" ? "" : current.subnetMask;
    gatewayInputEl.value = current.gateway === "-" ? "" : current.gateway;
    dns1InputEl.value = current.primaryDns === "-" ? "" : current.primaryDns;
    dns2InputEl.value = current.secondaryDns === "-" ? "" : current.secondaryDns;
    provisionIpInputEl.value = current.ipAddress === "-" ? "" : current.ipAddress;
    if (!provisionGatewayInputEl.value.trim()) {
      provisionGatewayInputEl.value = current.gateway === "-" ? "" : current.gateway;
    }
    setStatus("Network ayarlari okundu.", "ok");
  }

  async function saveNetwork() {
    if (!state.deviceId) {
      setStatus("Device ID bulunamadi.", "err");
      return;
    }

    setStatus("IP ayarlari guncelleniyor...");
    const res = await fetch("/api/device-config/network", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        deviceId: state.deviceId,
        interfaceId: state.interfaceId || "1",
        ipAddress: ipInputEl.value.trim(),
        subnetMask: maskInputEl.value.trim(),
        gateway: gatewayInputEl.value.trim(),
        primaryDns: dns1InputEl.value.trim(),
        secondaryDns: dns2InputEl.value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || "IP ayarlari guncellenemedi.");
    }

    xmlOutputEl.value = data.appliedXml || xmlOutputEl.value;
    if (data.rebootRequired) {
      setStatus("IP ayarlari kaydedildi. Reboot gonderiliyor...", "ok");
      await rebootDevice({ silent: true });
      setStatus("IP ayarlari kaydedildi. Reboot tamamlandiysa cihazi yeni IP ile kontrol edin.", "ok");
      return;
    }

    setStatus("IP ayarlari kaydedildi.", "ok");
  }

  async function loadEzviz() {
    if (!state.deviceId) {
      setStatus("Device ID bulunamadi.", "err");
      return;
    }

    setStatus("Verification ayarlari okunuyor...");
    const res = await fetch(`/api/device-config/ezviz?deviceId=${encodeURIComponent(state.deviceId)}`);
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || "EZVIZ ayarlari alinamadi.");
    }

    xmlOutputEl.value = data.xml || xmlOutputEl.value;
    ezvizEnabledMetaEl.textContent = data.enabled === null ? "-" : (data.enabled ? "true" : "false");
    ezvizRegisterMetaEl.textContent = data.registerStatus === null ? "-" : (data.registerStatus ? "true" : "false");
    verificationInputEl.value = data.verificationCode || "";
    setStatus("Verification ayarlari okundu.", "ok");
  }

  async function saveEzviz() {
    if (!state.deviceId) {
      setStatus("Device ID bulunamadi.", "err");
      return;
    }

    const verificationCode = verificationInputEl.value.trim();
    if (!verificationCode) {
      throw new Error("Verification Code zorunlu.");
    }

    setStatus("Verification ayari kaydediliyor...");
    const res = await fetch("/api/device-config/ezviz", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        deviceId: state.deviceId,
        verificationCode,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || "Verification ayari kaydedilemedi.");
    }

    xmlOutputEl.value = data.appliedXml || xmlOutputEl.value;
    setStatus("Verification ayari kaydedildi.", "ok");
    await loadEzviz();
  }

  async function rebootDevice(options = {}) {
    const silent = Boolean(options.silent);
    if (!state.deviceId) {
      setStatus("Device ID bulunamadi.", "err");
      return;
    }

    if (!silent) {
      setStatus("Cihaz reboot ediliyor...");
    }
    const res = await fetch("/api/device-config/reboot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: state.deviceId, waitForReconnect: true }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || "Cihaz reboot edilemedi.");
    }

    if (!silent) {
      setStatus(
        data.reconnected
          ? "Reboot komutu gonderildi ve cihaz cloud'a geri dondu."
          : "Reboot komutu gonderildi. Cihazin cloud'a geri donmesi bekleniyor.",
        "ok"
      );
    }
  }

  function clearProvisionPolling() {
    if (provisionPollTimer) {
      clearInterval(provisionPollTimer);
      provisionPollTimer = null;
    }
  }

  async function loadProvisionTask(taskId) {
    const res = await fetch(`/api/provision/tasks/${encodeURIComponent(taskId)}`);
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || "Task bilgisi alinamadi.");
    }

    const lines = [];
    if (Array.isArray(data.stages)) {
      for (const stage of data.stages) {
        lines.push(`${stage.name}: ${stage.status}${stage.detail ? ` - ${stage.detail}` : ""}`);
      }
    }
    if (data.result) {
      lines.push("");
      lines.push(`Result: ${JSON.stringify(data.result, null, 2)}`);
    }
    if (data.error) {
      lines.push("");
      lines.push(`Error: ${data.error}`);
    }
    provisionResultOutputEl.value = lines.join("\n");

    if (data.status === "completed") {
      clearProvisionPolling();
      setProvisionStatus("Kamera ayarlari tamamlandi.", "ok");
    } else if (data.status === "failed") {
      clearProvisionPolling();
      setProvisionStatus(data.error || "Kamera ayarlari basarisiz.", "err");
    } else {
      setProvisionStatus("Kamera ayarlari suruyor...");
    }
  }

  async function startProvision() {
    const payload = {
      cameraIp: provisionIpInputEl.value.trim(),
      userName: provisionUserInputEl.value.trim() || "admin",
      password: provisionPasswordInputEl.value,
      areaName: provisionAreaInputEl.value.trim(),
      gatewayOverride: provisionGatewayInputEl.value.trim(),
      sdkPort: Number(provisionSdkPortInputEl.value || 8000),
      enableDhcp: provisionDhcpInputEl.checked,
    };

    if (!payload.cameraIp) {
      throw new Error("Kamera IP zorunlu.");
    }
    if (!payload.password) {
      throw new Error("Parola zorunlu.");
    }

    setProvisionStatus("Kamera ayarlari baslatiliyor...");
    provisionResultOutputEl.value = "";
    const res = await fetch("/api/provision/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || "Kamera ayarlari baslatilamadi.");
    }

    clearProvisionPolling();
    await loadProvisionTask(data.taskId);
    provisionPollTimer = setInterval(() => {
      loadProvisionTask(data.taskId).catch((err) => {
        clearProvisionPolling();
        setProvisionStatus(err.message, "err");
      });
    }, 1500);
  }

  document.getElementById("load-btn").addEventListener("click", () => {
    loadNetwork().catch((err) => setStatus(err.message, "err"));
  });
  document.getElementById("save-btn").addEventListener("click", () => {
    saveNetwork().catch((err) => setStatus(err.message, "err"));
  });
  document.getElementById("reboot-btn").addEventListener("click", () => {
    rebootDevice().catch((err) => setStatus(err.message, "err"));
  });
  document.getElementById("load-ezviz-btn").addEventListener("click", () => {
    loadEzviz().catch((err) => setStatus(err.message, "err"));
  });
  document.getElementById("save-ezviz-btn").addEventListener("click", () => {
    saveEzviz().catch((err) => setStatus(err.message, "err"));
  });
  document.getElementById("start-provision-btn").addEventListener("click", () => {
    startProvision().catch((err) => setProvisionStatus(err.message, "err"));
  });

  syncMeta();
  if (state.deviceId) {
    loadNetwork().catch((err) => setStatus(err.message, "err"));
    loadEzviz().catch((err) => setStatus(err.message, "err"));
  } else {
    setStatus("Bu sayfaya deviceId ile gelinmeli.", "err");
  }
</script>
</body>
</html>
